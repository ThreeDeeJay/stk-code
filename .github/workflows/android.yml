name: android

env:
  Branch: ${{github.ref_name}}
  GH_TOKEN: ${{ github.token }}
  Artifacts: app/build/outputs/apk/debug/app-debug.apk
  WorkingDirectory: /Android

on:
  push:
    Branches: $Branch
  pull_request:
    Branches: $Branch
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Clone repo and submodules
      run: git clone --recurse-submodules https://github.com/${{github.repository}}.git . --branch ${{env.Branch}}

    - name: Get current date, commit hash and count
      run: |
        echo "CommitDate=$(git show -s --date=format:'%Y-%m-%d' --format=%cd)" >> $GITHUB_ENV
        echo "CommitHashShort=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV
        echo "CommitCount=$(git rev-list --count ${{env.Branch}} --)" >> $GITHUB_ENV
    
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate assets
      working-directory: .${{env.WorkingDirectory}}
      run: generate_assets.sh

    - name: Build
      working-directory: .${{env.WorkingDirectory}}
      run: |
        curl https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-android-src.tar.xz -o "libs.tar.xz"
        tar -xf libs-src.tar.xz
        export SDK_PATH=$ANDROID_SDK_HOME
        export NDK_PATH=$ANDROID_NDK_HOME
        # Optional for STK_MIN_ANDROID_SDK, STK_TARGET_ANDROID_SDK and STK_NDK_VERSION
        # If unset it will use the below values
        export STK_MIN_ANDROID_SDK=16
        export STK_TARGET_ANDROID_SDK=30
        export STK_NDK_VERSION=23.1.7779620
        ./generate_assets.sh
        ./make_deps.sh
        ./make.sh

    - name: List files
      working-directory: .${{env.WorkingDirectory}}
      run: ls -R

    - name: Upload Artifact to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: "${{github.event.repository.name}}_r${{env.CommitCount}}@${{env.CommitHashShort}}"
        path: "${{github.workspace}}${{env.WorkingDirectory}}/${{env.Artifacts}}/"

    - name: Release
      working-directory: .${{env.WorkingDirectory}}
      run: |
        gh release create r${{env.CommitCount}} --generate-notes --latest=false --prerelease --title "[${{env.CommitDate}}] ${{github.event.repository.name}} r${{env.CommitCount}}@${{env.CommitHashShort}}"
        gh release upload r${{env.CommitCount}} "${{env.Artifacts}}"
